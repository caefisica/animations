[project]
name = "animations"
version = "0.2.0"
description = "Physics animations in Python, rendered with Manim"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "manim[typst]>=0.19",
    "numpy>=2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/animations"]
